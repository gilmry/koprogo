events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # nginx sits behind Traefik, which terminates TLS and forwards over
        # plain HTTP. Without this, nginx's automatic trailing-slash redirect
        # (triggered by `try_files ... $uri/` below, e.g. /login -> /login/)
        # builds an absolute URL from its own $scheme, which is always
        # "http" here — sending HTTPS visitors on an unnecessary http://
        # round-trip back through Traefik's redirect, which some browsers'
        # loop detection flags as ERR_TOO_MANY_REDIRECTS. A relative
        # Location header lets the browser keep the original scheme.
        absolute_redirect off;

        # Security headers (complementing Traefik headers)
        #
        # ATTENTION — `add_header` ne s'hérite PAS comme on le croit. Dès
        # qu'un bloc imbriqué déclare un seul `add_header`, il perd TOUS ceux
        # du niveau parent. Le bloc des ressources statiques ci-dessous en
        # déclarait un (`Cache-Control`) et annulait donc les trois en-têtes
        # de sécurité, pour chaque `.js`, `.css`, `.svg` et `.woff2`.
        #
        # Constaté en production le 2026-09-08 :
        #
        #     GET /                    nosniff, DENY, 1; mode=block
        #     GET /_astro/....js       cache-control seul
        #
        # C'est le fichier JavaScript qui perdait `nosniff`, soit exactement
        # la ressource que cet en-tête existe pour protéger. D'où le fichier
        # inclus dans les DEUX blocs : nginx n'offre pas d'autre moyen.
        include /etc/nginx/snippets/securite.conf;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/securite.conf;
        }

        # SPA fallback: serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            include /etc/nginx/snippets/securite.conf;
        }
    }
}
