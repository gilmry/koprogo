# En-têtes de sécurité, inclus à CHAQUE niveau où un `add_header` existe.
#
# nginx remplace, il n'ajoute pas : un bloc qui déclare un `add_header`
# perd tous ceux de son parent. Ce fichier est la seule façon de garder
# les deux listes synchronisées.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# Déprécié, et nuisible sur certains navigateurs anciens : la
# recommandation actuelle est `0`, en s'appuyant sur la CSP. Conservé tel
# quel ici pour ne pas mêler un changement de posture à une correction de
# portée. À trancher séparément.
add_header X-XSS-Protection "1; mode=block" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# La CSP est en Report-Only, délibérément.
#
# L'API en sert une depuis `security_headers.rs`, mais sur des réponses
# JSON, où une CSP ne gouverne presque rien. Les documents HTML, qu'elle
# gouverne vraiment, n'en avaient aucune.
#
# La passer en mode bloquant sans l'avoir observée casserait l'application
# en silence chez l'utilisateur. Elle reproduit ici la politique de l'API ;
# il faut relever les violations rapportées avant de retirer `-Report-Only`.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.koprogo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
