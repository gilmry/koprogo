---
# Global defaults for all KoproGo environments
koprogo_user: koprogo
koprogo_repo: https://github.com/gilmry/koprogo.git
koprogo_branch: main
koprogo_dir: /home/{{ koprogo_user }}/koprogo
enable_ssl: false
enable_monitoring: false
enable_backup: false
rust_log: info
cors_allowed_origins: "*"
acme_email: "admin@example.com"
# CIDRs allowed to reach SSH (admin IPs, bastion, VPN). Required: the common
# role refuses to run with an empty list or 0.0.0.0/0. Keep real values out of
# git (ansible-vault, inventory host_vars or -e).
ssh_admin_cidrs: []
