---
# Common OS setup: updates, packages, user, firewall

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist
    autoremove: yes

- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
      - ufw
      - fail2ban
      - htop
      - ncdu
    state: present

- name: Create koprogo user
  user:
    name: "{{ koprogo_user }}"
    shell: /bin/bash
    create_home: yes
    groups: docker
    append: yes

- name: Configure UFW defaults
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

# SSH is restricted to admin source ranges (CyFun PR.AC-3 / PR.AC-5).
# Set ssh_admin_cidrs per environment (inventory, group_vars or vault).
- name: Assert SSH admin source ranges are set and not world-open
  assert:
    that:
      - ssh_admin_cidrs is defined
      - ssh_admin_cidrs | length > 0
      - "'0.0.0.0/0' not in ssh_admin_cidrs"
      - "'::/0' not in ssh_admin_cidrs"
    fail_msg: >-
      ssh_admin_cidrs must list the admin/bastion/VPN CIDRs allowed to reach
      SSH, and must not contain 0.0.0.0/0 or ::/0.

- name: Allow SSH from admin source ranges only
  ufw:
    rule: allow
    port: '22'
    proto: tcp
    from_ip: "{{ item }}"
    comment: "SSH admin"
  loop: "{{ ssh_admin_cidrs }}"

# Remove the legacy world-open rule only after the scoped rules exist,
# so a re-run on an existing host cannot lock admins out.
- name: Remove legacy SSH rule open to any source
  ufw:
    rule: allow
    port: '22'
    proto: tcp
    delete: true

- name: Allow HTTP
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
