name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
      - integration
      - staging
      - production
      - "claude/**"
      - "release/**"
      - "feature/**"
      - "story/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - dev
      - integration
      - staging
      - production
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  actions: write

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Rust formatting
        run: |
          cd backend
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd backend
          cargo clippy --all-targets --all-features -- -D warnings

      # Issue #661 — ADR-0008 §A : aucun montant / quote-part / valeur
      # alimentant un seuil légal ne doit être en f64. Le gate est dans le job
      # lint (pas de compilation requise, échoue en quelques secondes).
      - name: ADR-0008 gate — no f64 on money or quotas
        run: ./scripts/check-no-f64-money.sh

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: |
          cd backend
          cargo test --lib --all-features

  test-bdd:
    name: BDD Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koprogo_test
        # --shm-size : le defaut Docker est 64 Mo, et PostgreSQL y alloue ses
        # segments de memoire partagee. La migration
        # `20260826000000_alter_payment_reminders_to_numeric` fait un
        # `ALTER COLUMN TYPE` sur trois colonnes, donc une reecriture de table
        # que PostgreSQL parallelise. Sous charge, la demande depasse les
        # 64 Mo :
        #
        #   could not resize shared memory segment to 33554432 bytes:
        #   No space left on device                        (SQLSTATE 53100)
        #
        # Constate le 2026-08-27 sur la base de test locale, sous une charge
        # que mes propres campagnes paralleles avaient creee. Le risque en CI
        # est faible mais reel, et le durcissement ne coute rien.
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koprogo_test
        run: |
          cd backend
          sqlx migrate run

      - name: Run BDD tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koprogo_test
        run: |
          cd backend
          # --no-fail-fast: run ALL bdd*.rs binaries even if some panic, so the
          # full BDD picture surfaces in one CI run instead of one binary at a
          # time. Aligns with #524 (aggregate failures).
          #
          # 2026-08-26 : ce commentaire disait « run ALL bdd*.rs » alors que la
          # commande n'en listait que 5 sur 13. Les 8 manquants n'avaient JAMAIS
          # tourné en CI — dont bdd_meeting_complete (WP-H3, Art. 3.87 §3-5),
          # bdd_acp (Art. 3.84), bdd_building_conformity et bdd_voting_right,
          # tous marqués « bloqueur légal FAIT » dans le WBS sur la foi d'une
          # exécution locale ponctuelle. Mesurés un par un : 91/92 scénarios
          # verts, 1 skipped, 0 échec. Ils s'exécutent en quelques secondes une
          # fois compilés — c'est la compilation qui coûte, pas l'exécution.
          cargo test --no-fail-fast \
            --test bdd --test bdd_governance --test bdd_financial \
            --test bdd_operations --test bdd_community \
            --test bdd_acp --test bdd_building_conformity \
            --test bdd_list_buildings_role_based --test bdd_meeting_complete \
            --test bdd_portfolio --test bdd_validate_before_compute \
            --test bdd_voting_right --test bdd_iot

  coverage:
    # Mesure de couverture — n'existait pas avant le 2026-08-26. `make coverage`
    # était documenté dans CLAUDE.md mais appelait `cargo tarpaulin`, un outil
    # qui n'était installé nulle part : la couverture de KoproGo n'avait donc
    # jamais été mesurée, ni côté backend ni côté frontend.
    #
    # Non bloquant volontairement (`continue-on-error`) tant qu'aucun plancher
    # n'est fixé : un seuil posé avant de connaître la valeur réelle bloque la
    # CI sans rien apprendre. Le plancher se fixe une fois la pyramide branchée,
    # juste sous la valeur constatée, et c'est à ce moment que le job devient
    # bloquant.
    name: Coverage (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koprogo_test
        # --shm-size : le defaut Docker est 64 Mo, et PostgreSQL y alloue ses
        # segments de memoire partagee. La migration
        # `20260826000000_alter_payment_reminders_to_numeric` fait un
        # `ALTER COLUMN TYPE` sur trois colonnes, donc une reecriture de table
        # que PostgreSQL parallelise. Sous charge, la demande depasse les
        # 64 Mo :
        #
        #   could not resize shared memory segment to 33554432 bytes:
        #   No space left on device                        (SQLSTATE 53100)
        #
        # Constate le 2026-08-27 sur la base de test locale, sous une charge
        # que mes propres campagnes paralleles avaient creee. Le risque en CI
        # est faible mais reel, et le durcissement ne coute rien.
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koprogo_test
        run: |
          cd backend
          sqlx migrate run

      - name: Backend coverage (unit + BDD)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koprogo_test
        run: |
          cd backend
          mkdir -p ../coverage
          # Les binaires d'intégration API (`e2e_*.rs`) ne sont PAS inclus ici :
          # 59 binaires à instrumenter feraient exploser la durée du job. Ils
          # rejoindront cette mesure quand ils seront eux-mêmes branchés à la CI.
          cargo llvm-cov --lib --all-features \
            --lcov --output-path ../coverage/backend.lcov \
            --ignore-filename-regex '(tests/|/\.cargo/)'
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(tests/|/\.cargo/)'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend coverage (vitest v8)
        run: |
          cd frontend
          npm ci
          npm run test:unit:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 14

  test-e2e:
    # Nom rectifié 2026-08-26 : ces tests montent l'application Actix EN MÉMOIRE
    # (`test::init_service`) contre un PostgreSQL réel — vérifié sur les 59
    # fichiers, aucun ne passe par un socket réseau. C'est de l'intégration API,
    # pas du end-to-end. Le seul e2e réel du projet est Playwright (job
    # `playwright`). Le nom `E2E Tests` a entretenu la confusion : il a laissé
    # croire que 488 tests tournaient alors que la commande n'en jouait que 4.
    name: Integration Tests (API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koprogo_test
        # --shm-size : le defaut Docker est 64 Mo, et PostgreSQL y alloue ses
        # segments de memoire partagee. La migration
        # `20260826000000_alter_payment_reminders_to_numeric` fait un
        # `ALTER COLUMN TYPE` sur trois colonnes, donc une reecriture de table
        # que PostgreSQL parallelise. Sous charge, la demande depasse les
        # 64 Mo :
        #
        #   could not resize shared memory segment to 33554432 bytes:
        #   No space left on device                        (SQLSTATE 53100)
        #
        # Constate le 2026-08-27 sur la base de test locale, sous une charge
        # que mes propres campagnes paralleles avaient creee. Le risque en CI
        # est faible mais reel, et le durcissement ne coute rien.
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koprogo_test
        run: |
          cd backend
          sqlx migrate run

      - name: Run integration tests (API)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koprogo_test
        run: |
          cd backend
          # Lot 1 des tests d'intégration API. `--test e2e` seul ne jouait que
          # tests/e2e.rs (4 tests) et laissait dormir les 59 fichiers
          # `e2e_*.rs` (488 tests) — dont `e2e_api_keys.rs`, qui aurait
          # signalé dès sa première exécution que TOUS les endpoints de clés
          # API répondaient 403 en production (bug de casse de rôle, corrigé
          # dans ce même lot de commits).
          #
          # Élargissement par lots, pas d'un bloc : chaque binaire de test lie
          # le crate entier, et compiler les 59 d'un coup demande plus de
          # mémoire qu'un runner standard n'en a (mesuré : saturation à 7,6 Gio).
          # Ce lot 1 rassemble les 6 harnais mesurés le 2026-08-26 : 97 tests,
          # 97 verts après correction des 2 défauts trouvés (403 clés API, et un
          # payload resté sur `organization_id` après la Story 1.2).
          cargo test --no-fail-fast \
            --test e2e --test e2e_ag_sessions --test e2e_buildings \
            --test e2e_convocations --test e2e_gdpr --test e2e_payments \
            --test e2e_api_keys
          # Lot 2 — 13 harnais supplémentaires, 130 tests, mesurés verts le
          # 2026-08-26. Aucun n'avait jamais été exécuté, ni en CI ni en local.
          # Leur première exécution a mis au jour deux défauts produit :
          #
          #   * `/admin/security-incidents/overdue` répondait 404, avalé par
          #     `/{incident_id}` déclaré avant lui dans `routes.rs`. C'est
          #     l'endpoint des violations dépassant les 72 h de notification à
          #     l'APD (RGPD Art. 33) : inatteignable en production.
          #   * `/accounts/seed/belgian-pcmn` rendait 400 au lieu de 409 sur un
          #     PCMN déjà seedé — cas systématique, `POST /organizations`
          #     seedant déjà le plan comptable.
          #
          # `storage_s3` est le SEUL harnais qui exerce `S3Storage`, le
          # fournisseur utilisé en production. `tests/common/mod.rs` câble
          # `FileStorage` en dur : `e2e_documents` peut donc être vert sans
          # jamais toucher le chemin de production. Il démarre MinIO via
          # testcontainers, ce qui fonctionne nativement ici (cargo tourne sur
          # le runner, pas dans un conteneur).
          cargo test --no-fail-fast \
            --test e2e_security_incidents --test e2e_resolutions \
            --test e2e_meetings --test e2e_quotes --test e2e_tickets \
            --test e2e_notifications --test e2e_payment_recovery \
            --test e2e_budget --test e2e_notices --test e2e_skills \
            --test e2e_invoices --test e2e_local_exchange \
            --test e2e_documents --test storage_s3
          # Lot 3 et 4 — 41 harnais supplementaires, mesures verts les
          # 2026-08-26/27. Aucun n'avait jamais ete execute. Leur premiere
          # execution a mis au jour quatre defauts produit de plus, dont deux
          # de persistance : `tickets.work_order_sent_at` et
          # `resolutions.agenda_item_index`, tous deux renseignes par le
          # domaine et jamais ecrits en base.
          cargo test --no-fail-fast \
            --test e2e_auth --test e2e_consent --test e2e_accounts \
            --test e2e_legal_api --test integration_unit_owner \
            --test e2e_unit_owner --test e2e_marketplace --test e2e_polls \
            --test e2e_owner_contributions --test e2e_organization_users \
            --test e2e_individual_members --test e2e_gdpr_art30 \
            --test e2e_gamification --test e2e_etat_date \
            --test e2e_contractor_reports --test e2e_call_for_funds \
            --test e2e_work_reports --test e2e_units --test e2e_two_factor \
            --test e2e_technical_inspections
          cargo test --no-fail-fast \
            --test e2e_age_requests --test e2e_board --test e2e_board_dashboard \
            --test e2e_charge_distribution --test e2e_dashboard \
            --test e2e_energy_campaigns --test e2e_financial_reports \
            --test e2e_gdpr_audit --test e2e_http --test e2e_iot \
            --test e2e_journal_entries --test e2e_mcp_sse \
            --test e2e_organizations --test e2e_owners --test e2e_public_syndic \
            --test e2e_resolution_agenda --test e2e_resource_bookings \
            --test e2e_second_convocation --test e2e_shared_objects \
            --test e2e_users --test e2e_work_orders

  api-breaking-changes:
    name: API Breaking Change Detection (oasdiff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Install oasdiff
        run: |
          curl -sSfL https://raw.githubusercontent.com/Tufin/oasdiff/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Check for breaking API changes
        run: |
          # The live spec source is now docs/api/openapi.json (auto-exported
          # from the Rust utoipa ApiDoc). openapi.yaml remains as a
          # human-readable fallback during the migration period.
          BASE_SPEC="base/docs/api/openapi.json"
          PR_SPEC="pr/docs/api/openapi.json"
          [ -f "$BASE_SPEC" ] || BASE_SPEC="base/docs/api/openapi.yaml"
          [ -f "$PR_SPEC" ] || PR_SPEC="pr/docs/api/openapi.yaml"
          # Intentional, documented contract changes (v0.1.0 pre-release, no
          # live clients) are declared in .github/oasdiff-err-ignore.txt.
          # Any OTHER breaking change still hard-fails (--fail-on ERR).
          IGNORE_OPT=""
          [ -f "pr/.github/oasdiff-err-ignore.txt" ] \
            && IGNORE_OPT="--err-ignore pr/.github/oasdiff-err-ignore.txt"
          oasdiff breaking "$BASE_SPEC" "$PR_SPEC" \
            --fail-on ERR \
            $IGNORE_OPT \
            --format text || {
            echo ""
            echo "❌ Breaking API changes detected (non déclarés dans oasdiff-err-ignore.txt) !"
            echo "   If intentional, add a narrow rule to .github/oasdiff-err-ignore.txt + document in the PR."
            echo "   See: https://www.oasdiff.com/breaking-changes"
            exit 1
          }

      - name: Report non-breaking API changes
        if: always()
        run: |
          BASE_SPEC="base/docs/api/openapi.json"
          PR_SPEC="pr/docs/api/openapi.json"
          [ -f "$BASE_SPEC" ] || BASE_SPEC="base/docs/api/openapi.yaml"
          [ -f "$PR_SPEC" ] || PR_SPEC="pr/docs/api/openapi.yaml"
          echo "📋 API changelog (non-breaking):"
          oasdiff changelog "$BASE_SPEC" "$PR_SPEC" --format text || true

  contract-types:
    name: Contract Types Check (end-to-end anti-drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # Gate 1: Rust → OpenAPI spec
      # The export_openapi binary prints the spec generated from the live
      # ApiDoc derive to stdout. The committed docs/api/openapi.json MUST
      # match exactly — otherwise a #[derive(ToSchema)] or #[utoipa::path]
      # was added/removed without running `make openapi-export`.
      - name: Export OpenAPI spec from Rust source
        run: |
          cd backend
          cargo run --bin export_openapi > /tmp/openapi.fresh.json

      - name: Verify committed openapi.json matches Rust source
        run: |
          diff -u docs/api/openapi.json /tmp/openapi.fresh.json || {
            echo ""
            echo "❌ docs/api/openapi.json is out of sync with the Rust source."
            echo "   A DTO, enum, or handler annotation changed without a spec refresh."
            echo "   Run locally:"
            echo "     make openapi-export"
            echo "     git add docs/api/openapi.json && git commit"
            exit 1
          }

      # Gate 2: OpenAPI spec → TypeScript types
      # The committed src/types/api.d.ts MUST be regenerated from the spec
      # whenever the spec changes. Any drift here means the lib/api/*.ts
      # re-exports could be referencing schemas that no longer exist.
      - name: Verify api.d.ts is regenerated from the fresh spec
        run: |
          cd frontend
          npm run types:generate
          git diff --exit-code src/types/api.d.ts || {
            echo ""
            echo "❌ src/types/api.d.ts is stale."
            echo "   Run locally:"
            echo "     cd frontend && npm run types:generate"
            echo "     git add src/types/api.d.ts && git commit"
            exit 1
          }

      # Gate 3: TypeScript types → Svelte components
      # With enums re-exported from api.d.ts, any component referencing a
      # variant that no longer exists in the Rust source will fail here.
      # This closes the loop — Rust is the single source of truth for every
      # enum value visible in the UI.
      #
      # We use --threshold warning to also block on a11y warnings (form
      # labels, click handlers without keyboard events, ARIA roles, etc.).
      # As of commit a173848 the baseline is 0 warnings — any regression
      # hides a potential accessibility bug.
      - name: Run svelte-check (enforces frontend↔backend contract + a11y)
        run: |
          cd frontend
          # astro sync generates .astro/types.d.ts (astro:content + import.meta.env)
          # required by svelte-check; without it, svelte-check trips on type
          # references it can't resolve (matches local `npm run build` behavior).
          npx astro sync
          npx svelte-check --threshold warning

      # Gate 4: No hand-written enum re-introductions in lib/api/*.ts
      # A small-surface safety net: we allow a documented allowlist of
      # UI-only enums without backend counterpart (e.g. ResourceStatus in
      # bookings.ts), but any NEW `export enum` needs to be justified.
      #
      # Current allowlist (5): bookings.ts, convocations.ts,
      # energy-campaigns.ts, inspections.ts, sharing.ts. The latter has been
      # there since 2025-11-17 (commit 8e483bd, Community Features) but the
      # threshold was never raised because earlier CI gates short-circuited.
      # Surfaced by PR-E (CI gitflow alignment). TODO: refactor sharing.ts
      # to re-export from api.d.ts and ratchet back to 4.
      - name: Guard against new hand-written enums in lib/api
        run: |
          cd frontend
          count=$(grep -lE "^export enum [A-Z]" src/lib/api/*.ts 2>/dev/null | wc -l)
          if [ "$count" -gt 5 ]; then
            echo ""
            echo "❌ Too many hand-written enums in frontend/src/lib/api (got $count, max 5)."
            echo "   Re-export from api.d.ts instead:"
            echo "     export type Foo = components[\"schemas\"][\"Foo\"];"
            echo "     export const Foo = { ... } satisfies Record<string, Foo>;"
            echo ""
            echo "   Files still declaring enums:"
            grep -lE "^export enum [A-Z]" src/lib/api/*.ts
            exit 1
          fi

  vitest:
    name: Frontend Unit Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run vitest
        run: |
          cd frontend
          npx vitest run --reporter=default

  frontend-check:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: TypeScript check
        run: |
          cd frontend
          npm run build

      - name: Check formatting
        run: |
          cd frontend
          npx prettier --check .

  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-check]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koprogo_test
        # --shm-size : le defaut Docker est 64 Mo, et PostgreSQL y alloue ses
        # segments de memoire partagee. La migration
        # `20260826000000_alter_payment_reminders_to_numeric` fait un
        # `ALTER COLUMN TYPE` sur trois colonnes, donc une reecriture de table
        # que PostgreSQL parallelise. Sous charge, la demande depasse les
        # 64 Mo :
        #
        #   could not resize shared memory segment to 33554432 bytes:
        #   No space left on device                        (SQLSTATE 53100)
        #
        # Constate le 2026-08-27 sur la base de test locale, sous une charge
        # que mes propres campagnes paralleles avaient creee. Le risque en CI
        # est faible mais reel, et le durcissement ne coute rien.
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install chromium --with-deps

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build and start backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koprogo_test
          JWT_SECRET: ci-test-jwt-secret-for-playwright-minimum-32-chars
          TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SERVER_HOST: 127.0.0.1
          SERVER_PORT: 8080
          UPLOAD_DIR: ./uploads
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          ENABLE_RATE_LIMITING: false
          SMTP_ENABLED: false
          RUST_LOG: warn
          # WP-FE1 : ce job lance le backend en HTTP direct (cargo run, pas
          # docker-compose). Le défaut sûr COOKIE_SECURE=true poserait le
          # cookie refresh `Secure`, rejeté par le navigateur sur http://
          # → silent-refresh 401 → toute la suite auth E2E échoue.
          COOKIE_SECURE: "false"
        run: |
          cd backend
          cargo install sqlx-cli --no-default-features --features postgres
          sqlx migrate run
          cargo build
          cargo run &
          # Wait for backend to be ready (health check instead of fixed sleep)
          echo "Waiting for backend to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "Backend is ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend failed to start within 60s"
              exit 1
            fi
            sleep 5
          done

      - name: Start frontend dev server
        env:
          PUBLIC_API_URL: http://localhost:8080/api/v1
        run: |
          cd frontend
          node scripts/generate-config.js
          npx astro dev --port 3000 &
          # Wait for frontend to be ready
          echo "Waiting for frontend to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Frontend failed to start within 30s"
              exit 1
            fi
            sleep 2
          done

      # Nom rectifié 2026-08-26 : ce step s'intitulait « Run Playwright smoke
      # tests » alors qu'il lance le projet `chromium`, dont la config porte
      # `testIgnore: [/smoke\//, /scenarios\//, /characterization\//]` — il
      # EXCLUT donc précisément smoke. Les 98 tests du projet `smoke` n'ont
      # jamais tourné, et le diagnostic de #696 (« 109 échecs sur la smoke
      # suite ») portait en réalité sur les specs de la racine.
      - name: Run Playwright tests (chromium project)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_BASE: http://localhost:8080/api/v1
        run: |
          cd frontend
          npx playwright test --project=chromium

      # Le projet `smoke` (98 tests) est réintroduit en non bloquant : son état
      # réel n'a jamais été mesuré en CI, et le rendre bloquant d'emblée
      # casserait toutes les PR sur un héritage inconnu. Objectif : établir un
      # plancher chiffré, puis basculer en bloquant (WP-D1 / #696).
      - name: Run Playwright smoke project (report only)
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_BASE: http://localhost:8080/api/v1
        run: |
          cd frontend
          npx playwright test --project=smoke || true

      - name: Seed scenario world for Documentation Vivante
        env:
          PLAYWRIGHT_API_BASE: http://localhost:8080/api/v1
        run: |
          # Login admin and seed the world for scenario tests
          TOKEN=$(curl -s http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@koprogo.com","password":"admin123"}' \
            | jq -r '.token')
          curl -s -X POST http://localhost:8080/api/v1/seed/scenario/world \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' || echo "Seed already exists or failed"

      - name: Run Documentation Vivante scenarios (video generation)
        # Phase C ouverte (issue #617) : les .scenario.ts (admin-setup,
        # budget-workflow, etc.) cassent sur seeds + auth multi-rôle au
        # même titre que les .spec.ts Phase B FE déjà exclus via testIgnore.
        # Décision @gilmry 2026-06-15 : restaurer `continue-on-error: true`
        # le temps de stabiliser dans Phase C. À retirer quand toutes les
        # sub-tasks C-Scen sont DONE et 0 flake sur 3 runs successifs.
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_BASE: http://localhost:8080/api/v1
        run: |
          cd frontend
          npx playwright test --project=scenarios

      - name: Cleanup scenario world
        if: always()
        run: |
          TOKEN=$(curl -s http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@koprogo.com","password":"admin123"}' \
            | jq -r '.token') || true
          curl -s -X DELETE http://localhost:8080/api/v1/seed/scenario/world \
            -H "Authorization: Bearer $TOKEN" || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        test-unit,
        test-bdd,
        test-e2e,
        frontend-check,
        contract-types,
        vitest,
      ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: |
          cd backend
          cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: koprogo-api
          path: backend/target/release/koprogo-api
          retention-days: 7
