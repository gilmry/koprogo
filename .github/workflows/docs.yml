# Deploy Rust + Sphinx documentation to GitHub Pages
name: Deploy Documentation to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'backend/src/**'
      - 'backend/Cargo.toml'
      - '.github/workflows/docs.yml'
      - 'GOVERNANCE.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'SECURITY.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build both Rust and Sphinx documentation
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Sphinx dependencies
        run: |
          cd docs
          pip install -r requirements.txt

      - name: Generate video gallery page
        run: |
          python3 .claude/scripts/generate-video-rst.py

      - name: Build Rust documentation
        run: |
          cd backend
          SQLX_OFFLINE=true cargo doc --no-deps --release
        env:
          RUSTDOCFLAGS: "--default-theme=ayu"

      - name: Build Sphinx documentation
        run: |
          cd docs
          sphinx-build -b html -j auto . _build/html

      # ── La vitrine, récupérée plutôt que rejouée ──────────────────────
      #
      # Les sept parcours sont enregistrés par `vitrine.yml`, qui monte la
      # pile complète — postgres, backend, frontend construit. La rejouer
      # ici doublerait ce montage et ferait dériver deux enregistrements.
      #
      # On prend donc le dernier artefact publié. `if_no_artifact_found:
      # warn` : une documentation sans vitrine reste une documentation, et
      # faire échouer la publication du site pour des vidéos manquantes
      # serait donner à la preuve de valeur un pouvoir de verdict qu'elle ne
      # doit pas avoir (#876).
      # La vitrine vient de la branche `vitrine-publiee`, PAS d'un artefact.
      #
      # L'artefact `vitrine-feature-dev` a une rétention de sept jours (#963).
      # La doc, elle, est permanente : la faire dépendre d'un objet qui
      # s'efface revenait à garantir qu'elle perdrait sa première page au
      # premier creux d'activité sur `feature/dev`.
      #
      # `vitrine-publiee` est une branche orpheline d'un seul commit, que
      # `vitrine.yml` ré-écrit UNIQUEMENT quand la vitrine est complète. Elle
      # porte donc toujours la dernière vitrine VALIDE, pas la dernière
      # tentative. Un tournage partiel ne l'écrase pas.
      #
      # Pourquoi pas une release : la création de tag est en Tier 1 dans
      # CRITICAL.md, réservée à une action humaine explicite, et la pose du
      # tag de version est hors périmètre agent. Une branche ne touche ni
      # tag ni release.
      - name: Récupérer la dernière vitrine publiée
        id: vitrine
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: vitrine-publiee
          path: _vitrine
          fetch-depth: 1

      - name: Combine documentation
        run: |
          # Create combined docs directory
          mkdir -p _site

          # Copy Sphinx docs to /docs subdirectory
          mkdir -p _site/docs
          cp -r docs/_build/html/* _site/docs/

          # Copy Rust docs to /rust subdirectory
          mkdir -p _site/rust
          cp -r backend/target/doc/* _site/rust/

          # La vitrine, si l'étape précédente l'a rapportée.
          #
          # Elle est AUTONOME : son `index.html` ne référence aucune
          # ressource externe, et ses vidéos vivent à côté. Elle se pose donc
          # telle quelle, sans retouche.
          if [ -f _vitrine/index.html ]; then
            mkdir -p _site/vitrine
            cp -r _vitrine/* _site/vitrine/
            echo "✅ vitrine publiée : $(du -sh _site/vitrine | cut -f1)"
          else
            echo "⚠️  aucune vitrine à publier — le site part sans elle"
          fi

          # Create main index page
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>KoproGo Documentation</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                      max-width: 800px;
                      margin: 50px auto;
                      padding: 20px;
                      line-height: 1.6;
                  }
                  h1 { color: #2c3e50; }
                  .docs-links {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 20px;
                      margin-top: 30px;
                  }
                  .doc-card {
                      border: 2px solid #3498db;
                      border-radius: 8px;
                      padding: 25px;
                      text-decoration: none;
                      color: inherit;
                      transition: transform 0.2s, box-shadow 0.2s;
                  }
                  .doc-card:hover {
                      transform: translateY(-5px);
                      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                  }
                  .doc-card h2 {
                      margin-top: 0;
                      color: #3498db;
                  }
                  .doc-card p {
                      color: #666;
                      margin-bottom: 0;
                  }
                  /* La vitrine passe devant : c'est ce qu'on montre en
                     premier pour faire comprendre un produit. Les guides
                     viennent après, pour ceux qui ont déjà vu. */
                  .vitrine-hero {
                      display: block;
                      text-decoration: none;
                      color: inherit;
                      background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
                      border-radius: 12px;
                      padding: 2rem;
                      margin: 2rem 0;
                      transition: transform 0.2s, box-shadow 0.2s;
                  }
                  .vitrine-hero:hover {
                      transform: translateY(-3px);
                      box-shadow: 0 8px 24px rgba(30,58,95,0.3);
                  }
                  .vitrine-hero h2 {
                      margin: 0.35rem 0 0.75rem;
                      color: #ffffff;
                      font-size: 1.6rem;
                  }
                  .vitrine-hero p {
                      color: #dbe7f3;
                      margin: 0 0 0.6rem;
                      line-height: 1.55;
                  }
                  .vitrine-note {
                      font-size: 0.92rem;
                      color: #b9cde3 !important;
                      margin-bottom: 0 !important;
                  }
                  .vitrine-kicker {
                      display: inline-block;
                      font-size: 0.78rem;
                      letter-spacing: 0.09em;
                      text-transform: uppercase;
                      color: #90cdf4;
                      font-weight: 700;
                  }
              </style>
          </head>
          <body>
              <h1>📚 KoproGo Documentation</h1>
              <p>Bienvenue sur la documentation du projet KoproGo - Plateforme SaaS de gestion de copropriétés</p>

              <a href="vitrine/index.html" class="vitrine-hero">
                  <span class="vitrine-kicker">Commencez par ici</span>
                  <h2>🎬 La vitrine — le produit en vidéo</h2>
                  <p>Sept parcours narrés, un par rôle : le syndic, le copropriétaire,
                     le comptable, l'administration, le conseil de copropriété, le
                     prestataire et le modérateur.</p>
                  <p class="vitrine-note">Chapitres horodatés — on saute à l'étape
                     plutôt que de regarder le film. Chaque parcours est rejoué par le
                     gate de tests : ce que vous voyez est ce qui passe.</p>
              </a>

              <div class="docs-links">

                  <a href="docs/index.html" class="doc-card">
                      <h2>📖 Documentation Générale</h2>
                      <p>Architecture, guides de déploiement, roadmap et documentation complète du projet</p>
                  </a>

                  <a href="rust/koprogo_api/index.html" class="doc-card">
                      <h2>🦀 API Documentation Rust</h2>
                      <p>Documentation technique de l'API backend générée par cargo doc</p>
                  </a>

                  <a href="docs/blog.html" class="doc-card">
                      <h2>📝 Blog</h2>
                      <p>Actualités, annonces et articles techniques du projet KoproGo</p>
                  </a>

                  <a href="docs/legal/index.html" class="doc-card">
                      <h2>Conformite Juridique</h2>
                      <p>Bases legales belges, extraits de loi, matrice de conformite et analyse des risques</p>
                  </a>
              </div>
          </body>
          </html>
          EOF

          # ── La banniere ne doit jamais promettre une vitrine absente ─────
          #
          # Le telechargement est en `if_no_artifact_found: warn` : quand
          # l'artefact a expire (retention 7 jours), l'etape passe au vert et
          # le site part sans vitrine. La banniere, elle, est ecrite en dur
          # par le heredoc ci-dessus. Sans ce retrait, la premiere page
          # renverrait un 404 en silence, ce qui est precisement la
          # degradation muette que le projet s'interdit.
          if [ ! -f _site/vitrine/index.html ]; then
            echo "::error::Vitrine absente : banniere retiree de la page d accueil. Relancer vitrine.yml sur feature/dev, puis cette publication."
            grep -q 'class="vitrine-hero"' _site/index.html || {
              echo "::error::Banniere introuvable dans index.html : le retrait ne peut pas etre verifie."
              exit 1
            }
            sed -i '/<a href="vitrine\/index.html" class="vitrine-hero">/,/^ *<\/a>$/c\
              <p style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:1rem;margin:2rem 0;">La vitrine est indisponible pour cette publication. Elle figure habituellement en tete de cette page.</p>' _site/index.html
            grep -q 'class="vitrine-hero"' _site/index.html && {
              echo "::error::Le retrait de la banniere a echoue : elle est toujours la."
              exit 1
            }
            echo "Banniere retiree : aucun lien mort vers la vitrine."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  # Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
