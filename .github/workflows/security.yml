name: Security Audit

on:
  push:
    branches:
      - main
      - dev
      - integration
      - staging
      - production
  pull_request:
    branches:
      - main
      - dev
      - integration
      - staging
      - production
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: |
          cd backend
          # Ignores configured in backend/audit.toml
          cargo audit

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run npm audit
        run: |
          cd frontend
          # --omit=dev: vulns dans devDependencies (build-time tooling comme
          # @vite-pwa/astro → workbox-build → @babel/preset-env) ne sont pas
          # dans le bundle production et n'impactent pas les utilisateurs.
          # Le bundle prod (--omit=dev) est à zéro vuln.
          npm audit --omit=dev --audit-level=moderate

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # TEMP (2026-05-05): relaxed from `moderate` to `high` for the same
          # reason as `npm audit` above. To revert after dep drain.
          fail-on-severity: high

  # CyFun PR.IP-2 / DE.CM-8: misconfiguration scan of Terraform, Kubernetes
  # manifests, Helm values and Dockerfiles. HIGH+CRITICAL are reported to
  # Code Scanning; CRITICAL blocks (0 at introduction, 20 HIGH to triage).
  iac-scan:
    name: IaC misconfiguration scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trivy config scan
        # v0.36.0, pinned by commit (third-party action, supply chain)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-iac.sarif
          exit-code: "0"

      - name: Upload IaC findings to Code Scanning
        # v4.39.0, pinned by commit
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Block on CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  # CyFun PR.AC-1 / PR.DS-5: the same gitleaks config as the local hooks,
  # enforced server-side (local hooks can be skipped or not installed).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan commits for secrets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            # First push of a branch / scheduled run: no usable "before".
            if ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
              range="${{ github.sha }}~1..${{ github.sha }}"
            fi
          fi
          echo "Scanning $range"
          gitleaks git --config .gitleaks.toml --log-opts="$range" --redact --verbose .
