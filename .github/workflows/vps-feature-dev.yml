# CI légère pour le déploiement VPS ecosolva (koprogo.com).
#
# Pourquoi un workflow à part plutôt qu'ajouter `feature/dev` à
# docker-build-push.yml : celui-ci porte tout un schéma de tags destiné à
# ArgoCD et aux environnements Kubernetes (branch, branch-latest,
# branch-sha7, semver...). La branche déployée sur le VPS n'a besoin que
# d'une chose, un tag immuable par commit, et n'a rien à faire dans le
# nommage GitOps du cluster.
#
# Les images ne sont publiées QUE si les tests unitaires passent : c'est
# `deploy-ecosolva.sh` qui attend leur publication, donc conditionner celle-ci
# revient à mettre une barrière avant la production. Sans cela, la sortie de
# `feature/dev` du CI classique laisserait partir n'importe quoi pourvu que ça
# compile.
#
# Sous-ensemble volontairement réduit aux tests unitaires (5,3 min côté
# backend, 0,9 min côté frontend sur la pipeline complète). Les tests BDD,
# d'intégration et Playwright restent hors de cette branche : ce sont eux qui
# faisaient les 95 minutes.
#
# Ce workflow ne publie donc QU'UN tag : `sha-<7 premiers caractères>`.
# Volontairement pas de `latest` ni de tag mobile : c'est précisément ce que
# deploy-ecosolva.sh cherche à ne plus tirer. Il attend que les deux images
# de ce tag existent avant de déployer, et revient en arrière si le
# démarrage échoue.
#
# Sans ce workflow, `feature/dev` n'était construite nulle part : le VPS
# tirait `latest`, produit depuis une autre branche, et faisait donc tourner
# des images sans aucun rapport avec le commit qu'il inscrivait comme
# déployé.

name: VPS ecosolva (feature/dev)

on:
  push:
    branches:
      - feature/dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Note sur PUBLIC_API_URL (plus bas, dans la matrice) : le Traefik du VPS
# route ${API_DOMAIN:-api.koprogo.com} vers le backend. docker-build-push.yml
# compile `api2.koprogo.com`, qui ne résout pas du tout — un frontend
# construit avec cette valeur appelle un hôte inexistant.

jobs:
  tests-backend:
    name: Tests unitaires backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Mêmes clés que la pipeline complète : les deux se partagent le cache
      # au lieu d'en entretenir deux jeux.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # `--lib` uniquement : pas de base de données à provisionner, donc pas
      # de service Postgres ni de migrations à jouer.
      - name: Run unit tests
        run: |
          cd backend
          cargo test --lib --all-features

  tests-frontend:
    name: Tests unitaires frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run vitest
        run: |
          cd frontend
          npx vitest run --reporter=default

  images:
    # La barrière. Un test rouge empêche la publication des images, donc le
    # déploiement, qui ne fait que les attendre.
    needs: [tests-backend, tests-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Les deux images sont indépendantes : les construire en parallèle et
      # ne pas interrompre l'une si l'autre échoue. deploy-ecosolva.sh
      # n'agira de toute façon que lorsque les DEUX seront publiées.
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile.production
            context: ./backend
            # Parité avec docker-build-push.yml, qui produit les images qui
            # tournent aujourd'hui.
            build_args: SQLX_OFFLINE=true
          - service: frontend
            dockerfile: frontend/Dockerfile.production
            context: ./frontend
            # Seul le frontend déclare cet ARG ; le passer au backend ferait
            # un avertissement « build-arg non consommé » à chaque build.
            build_args: PUBLIC_API_URL=https://api.koprogo.com/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        # Sept caractères, comme le calcule deploy-ecosolva.sh côté serveur.
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:sha-${{ steps.vars.outputs.short_sha }}
          # `scope` par service, sinon les deux jobs de la matrice écrivent
          # dans le même index de cache GHA et s'écrasent : celui qui termine
          # en dernier gagne, et l'autre reconstruit tout au run suivant.
          # Mesuré sur trois runs — l'image backend alternait entre 25 s et
          # 17 min selon l'ordre de fin du run précédent.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: ${{ matrix.build_args }}
