# Pile de DÉVELOPPEMENT et de RECETTE.
#
# `name:` n'est pas décoratif. Sans lui, Compose déduit le nom de projet du
# répertoire — « koprogo » — qui est AUSSI celui de la pile déployée
# (docker-compose.prod.yml + docker-compose.ecosolva.yml). Sur un hôte où la
# démo tourne, cette pile-ci revendiquait donc ses conteneurs, et son volume
# `postgres_data` résolvait vers `koprogo_postgres_data` : les données
# vivantes (#872).
name: koprogo-dev

# ── Les ports sont DÉCALÉS, et c'est la moitié du correctif ────────────────
#
# Le `name:` séparait les conteneurs et les volumes ; il ne séparait pas les
# PORTS, qui sont globaux à l'hôte. Cette pile réclamait encore le 80, tenu
# par le Traefik de la démo : soit elle refusait de démarrer, soit elle le
# prenait. Et `make test-e2e` visait `http://localhost`, qui traverse ce
# Traefik jusqu'à `Host(api.koprogo.com)` — la démo.
#
# Ce n'est pas un risque à entourer de précautions, c'est la PROCÉDURE : la
# recette exige un état initial connu (`make seed-reset` POSTe sur
# /seed/scenario/world, `make reset-db` annonce « SUPPRIME TOUTES LES
# DONNÉES »). Sa précondition de reproductibilité est exactement ce qui
# détruirait la démo.
#
# Ports retenus par l'ADR 0050, vérifiés libres sur `ecosolva` le 2026-09-12
# (occupés : 22, 25, 53, 80, 443, 5432, 8095, 9000, 9001, 9090, 9093, 9100) :
#
#   service            démo    recette
#   HTTP (Traefik)     80      8090
#   Dashboard Traefik  —       8091
#   PostgreSQL         5432    15432   (localhost)
#   MinIO S3/console   9000/1  19000/1 (localhost)
#
# `garde-ports-piles-distinctes` interdit désormais qu'une pile suivie
# réclame un port déjà tenu par une autre.

# KoproGo - Development Environment
# Usage: docker compose up
# - Frontend + API: http://localhost:8090
# - Hot reload enabled for both backend and frontend

services:
  # Traefik Reverse Proxy (HTTP only for dev)
  traefik:
    image: traefik:latest
    container_name: koprogo-dev-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true" # Dashboard on :8081
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "8090:80" # HTTP — 80 est tenu par le Traefik de la démo (ADR 0050)
      - "8091:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - koprogo-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: koprogo-dev-postgres
    environment:
      POSTGRES_DB: koprogo_db
      POSTGRES_USER: koprogo
      POSTGRES_PASSWORD: koprogo123
    ports:
      - "127.0.0.1:15432:5432" # Localhost only — 5432 est celui de la démo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koprogo -d koprogo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koprogo-network

  # Backend (Rust + Actix) with HOT RELOAD via cargo-watch
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: koprogo-dev-backend
    environment:
      DATABASE_URL: postgresql://koprogo:koprogo123@postgres:5432/koprogo_db
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: debug
      RUST_BACKTRACE: 1
      SQLX_OFFLINE: "true"
      # ── Secrets de recette : EN DUR, et surtout PAS `${JWT_SECRET}` ────────
      #
      # Le backend refuse de démarrer sans `JWT_SECRET` : `validate_jwt_secret`
      # (main.rs) exige 32 caractères au moins et rejette la valeur par défaut.
      # Cette pile ne l'a jamais posé — personne ne l'avait vu, puisqu'elle
      # n'avait jamais été lancée (#872).
      #
      # La tentation était d'écrire `${JWT_SECRET:-…}`. Il ne faut PAS : le
      # `.env` de ce répertoire porte les secrets de la DÉMO — Compose le
      # charge automatiquement — et la recette aurait hérité du secret de
      # production. Un jeton forgé ici aurait alors valu là-bas, ce qui annule
      # la séparation que toute cette pile cherche à établir.
      #
      # Ces deux valeurs sont donc jetables, publiques, et ne valent que pour
      # une base jetable. Les réutiliser ailleurs serait une faute.
      JWT_SECRET: recette-jetable-koprogo-dev-ne-jamais-utiliser-ailleurs
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # WP-FE1 : dev/E2E sur http://localhost:8090 → cookie refresh sans flag
      # Secure (sinon le navigateur le rejette hors HTTPS). PROD = true.
      COOKIE_SECURE: "false"
      ENABLE_RATE_LIMITING: false
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3} # Basculer sur le stockage local: STORAGE_PROVIDER=local
      UPLOAD_DIR: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-koprogo-dev} # Pour du S3 externe, renseigner vos identifiants/bucket
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-dev}
    volumes:
      # Hot reload: mount source code
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target_cache:/app/target
      # Docker socket for testcontainers (BDD/E2E tests)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend-metrics.rule=Host(`localhost`) && Path(`/metrics`)"
      - "traefik.http.routers.backend-metrics.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - koprogo-network

  # Frontend (Astro + Svelte) with HOT RELOAD
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: koprogo-dev-frontend
    environment:
      # Lue par le NAVIGATEUR, donc depuis l'hôte : c'est le port publié qu'il
      # faut, pas celui du réseau Compose. Laisser `http://localhost/api/v1`
      # ici aurait envoyé chaque appel de la recette au Traefik de la démo —
      # le défaut même que le décalage de ports corrige (ADR 0050, #872).
      PUBLIC_API_URL: http://localhost:8090/api/v1
    volumes:
      # Hot reload: mount source code
      - ./frontend:/app
      - /app/node_modules # Prevent overwriting node_modules
    depends_on:
      - backend
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - koprogo-network

  # MinIO for local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: koprogo-dev-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    # MinIO n'est exposé qu'en loopback. Utilisez un tunnel SSH si vous avez besoin d'y accéder à distance.
    ports:
      - "127.0.0.1:19000:9000" # S3 API (localhost uniquement)
      - "127.0.0.1:19001:9001" # Console (localhost uniquement)
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koprogo-network

  minio-bootstrap:
    image: minio/mc:latest
    container_name: koprogo-dev-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-koprogo-dev}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      ENABLE_MINIO_BOOTSTRAP: ${ENABLE_MINIO_BOOTSTRAP:-true} # Mettre à false si vous utilisez un S3 géré externe
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -e;
      if [ "${ENABLE_MINIO_BOOTSTRAP:-true}" != "true" ]; then
        echo "Skipping MinIO bootstrap";
        exit 0;
      fi;
      until mc alias set local "$${S3_ENDPOINT}" "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do
        echo "Waiting for MinIO...";
        sleep 2;
      done;
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set private "local/$${S3_BUCKET}" >/dev/null 2>&1 || true;
      echo "MinIO bucket $${S3_BUCKET} ready.";
    networks:
      - koprogo-network

volumes:
  postgres_data:
  cargo_cache:
  cargo_git:
  target_cache:
  minio_data:

networks:
  koprogo-network:
    driver: bridge
