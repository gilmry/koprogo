{% extends "!layout.html" %}

{%- block extrahead %}
  {{ super() }}
  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-qnanCcPO5s1SB5148P_AL.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
{% endblock %}

{#- Bandeau de statut : le texte vit dans conf.py (`statut_projet`). #}
{%- block document %}
  {%- if statut_projet %}
  <div class="admonition warning statut-projet" role="note">
    <p class="admonition-title">Statut du projet</p>
    <p>{{ statut_projet }}</p>
  </div>
  {%- endif %}
  {{ super() }}
{%- endblock %}
